<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MetaMask Explore — Simulator</title>
<link rel="stylesheet" href="mmds/colors_and_type.css?v=black-bg" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<style>
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: 400;
    font-style: normal;
    display: inline-block;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    -webkit-font-smoothing: antialiased;
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: var(--color-text-default);
    overflow: hidden;
  }

  #root {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: row;
  }

  /* Shared */
  .mono { font-family: var(--font-family-default); }

  /* Scrollbar inside the phone */
  .phone-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .phone-scroll { scrollbar-width: none; }

  /* Custom scrollbar for the panel */
  .panel-scroll::-webkit-scrollbar { width: 10px; }
  .panel-scroll::-webkit-scrollbar-track { background: transparent; }
  .panel-scroll::-webkit-scrollbar-thumb { background: var(--color-border-muted); border-radius: 8px; }
  .panel-scroll::-webkit-scrollbar-thumb:hover { background: var(--color-border-default); }

  /* ─── The control panel ─── */
  .panel {
    width: 340px;
    flex-shrink: 0;
    background: var(--color-background-default);
    border-left: 1px solid var(--color-border-muted);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: var(--font-family-default);
    order: 2;
  }
  .stage { order: 1; }

  .panel-header {
    padding: 20px 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .panel-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--color-text-default);
  }
  .panel-sub {
    font-size: 12px;
    color: var(--color-text-alternative);
    font-weight: 400;
    margin-top: 2px;
  }
    background: var(--color-background-default);
    border-right: 1px solid var(--color-border-muted);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .panel-header {
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--color-border-muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .panel-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .panel-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--color-text-default);
  }
  .panel-sub {
    font-size: 11px;
    color: var(--color-text-alternative);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-weight: 500;
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0 48px;
  }

  .section {
    padding: 16px 20px;
    border-bottom: 1px solid var(--color-border-muted);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .section-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--color-text-alternative);
    letter-spacing: 0;
    text-transform: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-title-count {
    font-family: var(--font-family-default);
    font-size: 11px;
    color: var(--color-text-alternative);
    font-weight: 400;
  }

  /* Tab description block */
  .tab-description {
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--color-background-muted);
    font-size: 12px;
    line-height: 18px;
    color: var(--color-text-alternative);
  }
  .tab-description b {
    color: var(--color-text-default);
    font-weight: 500;
  }
    color: var(--color-text-alternative);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-title-count {
    font-family: var(--font-family-default);
    font-size: 10px;
    color: var(--color-text-muted);
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
  }

  /* Row — column layout, label full-width above control */
  .row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 4px 0;
  }
  .row-label {
    font-size: 13px;
    color: var(--color-text-default);
    font-weight: 400;
    white-space: nowrap;
  }
  .row-hint {
    font-size: 11px;
    color: var(--color-text-alternative);
    margin-top: 0;
    line-height: 16px;
  }
  .row-label-wrap {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .row-inline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-direction: row;
  }

  /* Toggle */
  .toggle {
    position: relative;
    width: 34px;
    height: 20px;
    border-radius: 9999px;
    background: var(--color-background-muted);
    border: 1px solid var(--color-border-muted);
    cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease;
    flex-shrink: 0;
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 9999px;
    background: var(--color-text-alternative);
    transition: transform 140ms ease, background 140ms ease;
  }
  .toggle.on {
    background: var(--color-primary-default);
    border-color: var(--color-primary-default);
  }
  .toggle.on::after {
    transform: translateX(14px);
    background: var(--color-primary-inverse);
  }

  /* Segmented */
  .seg {
    display: flex;
    background: var(--color-background-muted);
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
    width: 100%;
  }
  .seg-btn {
    flex: 1;
    padding: 6px 8px;
    border: none;
    background: transparent;
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    color: var(--color-text-alternative);
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
    font-weight: 500;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
  }
  .seg-btn.active {
    background: var(--color-background-section);
    color: var(--color-text-default);
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .seg-btn:hover:not(.active) {
    color: var(--color-text-default);
  }
  /* Compact icon segmented (for Appearance / Screen state) */
  .seg.seg-icon {
    width: auto;
    flex: 0 0 auto;
  }
  .seg-btn-icon {
    flex: 0 0 auto;
    width: 26px;
    height: 22px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* Slider */
  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 0 8px;
  }
  .slider-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .slider-val {
    font-family: var(--font-family-default);
    font-size: 11px;
    color: var(--color-text-alternative);
    background: var(--color-background-muted);
    padding: 2px 6px;
    border-radius: 4px;
  }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: var(--color-background-muted);
    border-radius: 4px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 9999px;
    background: var(--color-primary-default);
    cursor: pointer;
    border: 2px solid var(--color-background-default);
  }
  input[type=range]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 9999px;
    background: var(--color-primary-default);
    cursor: pointer;
    border: 2px solid var(--color-background-default);
  }

  /* Select-like dropdown of pills */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding-top: 4px;
  }
  .chip {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 9999px;
    background: var(--color-background-muted);
    border: 1px solid transparent;
    color: var(--color-text-alternative);
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    font-weight: 500;
  }
  .chip.active {
    background: var(--color-text-default);
    color: var(--color-background-default);
    border-color: var(--color-text-default);
  }
  .chip:hover:not(.active) {
    color: var(--color-text-default);
  }

  /* Reset button */
  .panel-footer {
    border-top: 1px solid var(--color-border-muted);
    padding: 12px 20px;
    display: flex;
    gap: 8px;
  }
  .btn-ghost {
    flex: 1;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--color-border-muted);
    background: transparent;
    color: var(--color-text-default);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .btn-ghost:hover {
    background: var(--color-background-hover);
    border-color: var(--color-border-default);
  }

  /* Small status indicator dot */
  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 9999px;
    background: var(--color-success-default);
    box-shadow: 0 0 8px var(--color-success-default);
    margin-right: 6px;
    vertical-align: middle;
  }

  /* ─── Stage (right side where the phone sits) ─── */
  .stage {
    flex: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: stretch;
    background: #000;
    position: relative;
    overflow: hidden;
  }
  .stage-tabs {
    position: relative;
    z-index: 2;
    display: flex;
    gap: 2px;
    padding: 12px 16px 0;
    background: transparent;
  }
  .stage-tab {
    font-family: var(--font-family-default);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--color-text-alternative);
    background: transparent;
    border: 1px solid transparent;
    border-bottom: none;
    padding: 8px 14px 9px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }
  .stage-tab:hover {
    background: var(--color-background-hover);
    color: var(--color-text-default);
  }
  .stage-tab.is-active {
    background: var(--color-background-alternative);
    color: var(--color-text-default);
    border-color: var(--color-border-muted);
    position: relative;
  }
  .stage-tab.is-active::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: var(--color-background-alternative);
  }
  .stage-links {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    padding-right: 16px;
    padding-bottom: 6px;
    align-self: flex-end;
  }
  .stage-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-family-default);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--color-text-alternative);
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 6px;
    transition: background 120ms ease, color 120ms ease;
  }
  .stage-link:hover {
    color: var(--color-text-default);
    background: var(--color-background-hover);
  }
  .stage-canvas {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    border-top: none;
    background: #000;
  }
  /* When the gallery is in the canvas, don't flex-center — let it scroll naturally. */
  .stage-canvas:has(.gallery-root) {
    display: block;
  }
  .stage-grid { display: none; }
  .phone-chrome {
    padding: 12px;
    border-radius: 60px;
    background: linear-gradient(165deg, #5a5a5e 0%, #2a2a2e 36%, #111113 72%, #0a0a0a 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.22),
      inset 0 -1px 0 rgba(0,0,0,0.55),
      0 0 0 1px #2c2c30,
      0 28px 80px rgba(0,0,0,0.7);
  }
  .phone-chrome > * {
    border-radius: 48px;
    overflow: hidden;
  }
  .phone-chrome .bare-phone {
    border-radius: 48px;
    box-shadow: none;
  }
  .stage-meta {
    position: absolute;
    top: 16px;
    left: 20px;
    font-family: var(--font-family-default);
    font-size: 11px;
    color: var(--color-text-alternative);
    letter-spacing: 0.02em;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .stage-meta .pill {
    padding: 3px 8px;
    background: var(--color-background-section);
    border: 1px solid var(--color-border-muted);
    border-radius: 4px;
    color: var(--color-text-default);
  }

  /* Bare (no chrome) phone */
  .bare-phone {
    width: 393px;
    height: 852px;
    background: var(--color-background-default);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 40px 80px rgba(0,0,0,0.4), 0 0 0 1px var(--color-border-muted);
    display: flex;
    flex-direction: column;
  }

  /* When light theme on the sim */
  html.embed,
  html.embed body,
  html.embed #root {
    width: 393px;
    height: 852px;
    overflow: hidden;
    background: #000;
  }
  html.embed #root {
    display: block;
  }

  html.embed .bare-phone {
    box-shadow: none;
    border-radius: 0;
  }

  .bare-phone.light { color-scheme: light; }

  /* Sparkline end-dot pulse — 2.4s, perfect circle via HTML overlay */
  @keyframes sparklinePulse {
    0%   { transform: scale(0.25); opacity: 0.55; }
    70%  { transform: scale(1.0);  opacity: 0; }
    100% { transform: scale(1.0);  opacity: 0; }
  }

  /* ─── Component gallery ─── */
  .stage-canvas.is-pannable { cursor: grab; }
  .stage-canvas.is-panning  { cursor: grabbing; user-select: none; }
  .stage-canvas.is-panning * { cursor: grabbing !important; }
  .gallery-root {
    width: max-content;
    min-width: 100%;
    min-height: 100%;
    padding: 32px 32px 80px;
    box-sizing: border-box;
    color: var(--color-text-default);
    background: var(--color-background-default);
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 393px);
    gap: 48px 32px;
    justify-content: start;
    width: max-content;
  }
  .gallery-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .gallery-card-name {
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-alternative);
    font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0 4px;
  }
  .gallery-card-body {
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
    overflow: visible;
    min-height: 60px;
  }
  .gallery-card-body > * {
    max-width: 100%;
  }
  .gallery-variant {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-start;
  }
  .gallery-variant-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-text-alternative);
    font-weight: 600;
  }
  .gallery-variant-preview {
    display: flex;
    align-items: center;
  }
</style>
